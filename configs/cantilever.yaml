# Cantilever beam with tip force (port of Karamelo
# examples/Cantilever/cantilever_force_tip.mpm) - TLMPM + Neo-Hookean
# Units: Pa, m, s

dimension: 3
box: [[0.0, 0.0, 0.0], [4.0, 1.0, 1.0]]
cellsize: 0.05
basis: linear
precision: float64

method:
  type: tlmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: neo-hookean
    rho: 1050.0
    E: 1.0e6
    nu: 0.3

regions:
  - {id: beam, type: box, center: [2.0, 0.5, 0.5], size: [2.0, 0.5, 0.5]}
  # fixed left end: x <= cellsize/4
  - {id: rFixed, type: box, center: [-999999.875, 0.5, 0.5],
     size: [1000000.125, 10.0, 10.0]}
  # tip: x >= 4 - cellsize/4, y >= 1 - cellsize/4
  - {id: rEnd, type: box, center: [999999.9875, 999999.9875, 0.5],
     size: [999996.0125, 999998.9875, 10.0]}

solids:
  - {id: solid1, material: mat1, region: beam, ppc: 2}

boundary_conditions:
  - {id: fBCLX, type: velocity_nodes, region: rFixed, vx: 0, vy: 0, vz: 0}
  - {id: fEnd, type: force_nodes, region: rEnd, force: [0, -1300, 0]}

output:
  interval: 200
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y, z]
  log: [kinetic_energy]

run:
  end_time: 3.0
  dt_factor: 0.5
