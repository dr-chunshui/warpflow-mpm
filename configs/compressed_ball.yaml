# Rigid plate compressing an elastic disk (port of Karamelo
# examples/compressed_ball/compressed_ball.mpm)
# Units: MPa, mm, s

dimension: 2
box: [[-0.5, 0.0], [0.5, 0.6]]
cellsize: 0.05
basis: linear
precision: float64

method:
  type: ulmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: linear-elastic
    rho: 1000.0
    E: 1.0e3
    nu: 0.3
  - id: matr
    model: rigid
    rho: 1000.0

regions:
  - {id: rBall, type: cylinder, center: [0.0, 0.25], radius: 0.25}
  - {id: rPlate, type: box, center: [0.0, 0.55], size: [0.5, 0.05]}
  - {id: rBottom, type: box, center: [0.0, -999999.99496875],
     size: [10.0, 1000000.00503125]}

solids:
  - {id: sBall, material: mat1, region: rBall, ppc: 2}
  - {id: sPlate, material: matr, region: rPlate, ppc: 2}

boundary_conditions:
  - {id: fBCLY, type: velocity_nodes, region: rBottom, vy: 0}
  - {id: v0Plate, type: velocity_particles, solid: sPlate, region: rPlate,
     v: [0, -0.1]}

output:
  interval: 50
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y, vx, vy, s11, s22]
  log: [kinetic_energy, strain_energy]

run:
  end_step: 1000
  dt: 0.001
