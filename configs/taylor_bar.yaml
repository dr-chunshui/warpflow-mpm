# Taylor bar impact on a rigid wall (port of Karamelo
# examples/Taylor-bar/cylindrical/ULMPM/cylindrical_taylor_bar.mpm)
# Units: MPa, mm, ms-ish (rho in g/mm^3)

dimension: 3
box: [[-12.7, -7.5, -7.5], [13.45, 7.5, 7.5]]
cellsize: 0.25
basis: linear
precision: float64

method:
  type: ulmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: eos-strength
    eos: {type: shock, rho0: 8.94e-6, K: 100.877, c0: 3933.0, S: 1.5,
          gamma: 0.0, Tr: 25.0, cv: 0.0, Q1: 0.0, Q2: 0.0}
    strength: {type: johnson-cook, G: 43.9, A: 0.065, B: 0.356, n: 0.37,
               epsdot0: 1.0e-3, C: 0.0, m: 0.0, Tr: 25.0, Tm: 1600.0}

regions:
  - {id: cyl, type: cylinder, axis: x, center: [0.0, 0.0, 0.0],
     radius: 3.8, height: 25.4}
  - {id: rWall, type: box, center: [500013.325, 0.0, 0.0],
     size: [500000.125, 100.0, 100.0]}

solids:
  - {id: solid1, material: mat1, region: cyl, ppc: 1}

initial_conditions:
  - {id: v0, type: initial_velocity, select: cyl, v: [190.0, 0, 0]}

boundary_conditions:
  - {id: BC_Wall, type: velocity_nodes, region: rWall, vx: 0}

output:
  interval: 10
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y, z, vx, vy, vz]
  log: [kinetic_energy]

run:
  end_step: 20000
  dt_factor: 0.25
