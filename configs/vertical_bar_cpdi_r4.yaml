# Elastic bar under gravity, CPDI-R4 (port of Karamelo
# examples/Vertical_bar/CPDI/CPDI-r4/vertical_bar.mpm) - ULCPDI + neo-hookean
# Units: Pa, m, s

dimension: 2
box: [[-0.5, -2.0], [0.5, 0.0]]
cellsize: 0.2
basis: linear
precision: float64

method:
  type: ulcpdi
  style: r4
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: neo-hookean
    rho: 1050.0
    E: 1.0e6
    nu: 0.3

regions:
  - {id: bar, type: box, center: [0.0, -0.5], size: [0.5, 0.5]}
  - {id: rTop, type: box, center: [0.0, 999999.975],
     size: [10.0, 1000000.025]}

solids:
  - {id: solid1, material: mat1, region: bar, ppc: 3}

boundary_conditions:
  - {id: fBCLX, type: velocity_nodes, region: rTop, vy: 0}
  - {id: fbody, type: body_force, g: [0, -1000.0]}

output:
  interval: 20
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y]
  log: [kinetic_energy]

run:
  end_time: 0.26
  dt_factor: 0.2
