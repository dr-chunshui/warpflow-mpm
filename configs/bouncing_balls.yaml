# Two elastic balls colliding (port of Karamelo examples/Bouncing_balls/ULMPM)
# Units: Pa, m, s

dimension: 2
box: [[-1.0, -1.0], [1.0, 1.0]]
cellsize: 0.1
basis: linear
precision: float64

method:
  type: ulmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: linear-elastic
    rho: 1050.0
    E: 1.0e6
    nu: 0.3

regions:
  - id: rBall1
    type: cylinder
    center: [-0.5, -0.5]
    radius: 0.4
  - id: rBall2
    type: cylinder
    center: [0.5, 0.5]
    radius: 0.4

solids:
  - id: sBall1
    material: mat1
    region: rBall1
    ppc: 2
  - id: sBall2
    material: mat1
    region: rBall2
    ppc: 2

initial_conditions:
  - id: v0Ball1
    type: initial_velocity
    select: rBall1
    v: [0.1, 0.1]
  - id: v0Ball2
    type: initial_velocity
    select: rBall2
    v: [-0.1, -0.1]

output:
  interval: 20
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y, z]
  log: [kinetic_energy]

run:
  end_time: 3.5
  dt_factor: 1.0
