# Rigid rotation vortex with manufactured solution (port of Karamelo
# examples/vortex/Linear/vortex.mpm) - TLMPM + neo-hookean annulus
# Units: Pa, m, s

dimension: 2
box: [[-1.25, -1.25], [1.25, 1.25]]
cellsize: 0.1
basis: linear
precision: float64

method:
  type: tlmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

variables:
  G: 1.0
  T: 1.0
  r: sqrt(x*x+y*y)
  theta: atan2(y,x)
  R: (Ri+Ro)/2
  h: 1 - 8*((r - R)/(Ri-Ro))**2 + 16*((r - R)/(Ri-Ro))**4
  hp: -16*(r - R)/(Ri-Ro)**2 + 64*(r - R)**3/(Ri-Ro)**4
  hpp: -16/(Ri-Ro)**2 + 192*(r - R)**2/(Ri-Ro)**4
  g: G*sin(PI*time/T)
  gp: G*PI/T*cos(PI*time/T)
  gpp: -PI*PI/(T*T)*g
  alpha: g*h
  mdr: mu/rho0
  br: (mdr*(3*g*hp+r*g*hpp) - r*gpp*h)*sin(alpha) + (mdr*r*(g*hp)**2 - r*(gp*h)**2)*cos(alpha)
  bt: (-mdr*(3*g*hp+r*g*hpp) + r*gpp*h)*cos(alpha) + (mdr*r*(g*hp)**2 + r*(gp*h)**2)*sin(alpha)
  bx: br*cos(theta) - bt*sin(theta)
  by: br*sin(theta) + bt*cos(theta)

materials:
  - id: mat1
    model: neo-hookean
    rho: 1050.0
    E: 1.0e6
    nu: 0.3

regions:
  - {id: cyl, type: cylinder, center: [0.0, 0.0], radius: 1.25,
     inner_radius: 0.75}
  - {id: cyl_in, type: cylinder, center: [0.0, 0.0], radius: 0.75}
  - {id: cyl_ext, type: cylinder, center: [0.0, 0.0], radius: 1.25,
     exterior: true}

solids:
  - {id: solid1, material: mat1, region: cyl, ppc: 2}

boundary_conditions:
  - {id: fbody, type: body_force, g: ["bx", "by", 0]}
  - {id: fo, type: velocity_nodes, region: cyl_ext, vx: 0, vy: 0}
  - {id: fin, type: velocity_nodes, region: cyl_in, vx: 0, vy: 0}

diagnostics:
  - id: error
    type: check_solution
    u: ["(cos(alpha)-1)*x - sin(alpha)*y",
        "sin(alpha)*x + (cos(alpha)-1)*y",
        "0"]

output:
  interval: 20
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y]
  log: [kinetic_energy]

run:
  end_time: 1.0
  dt_factor: 0.2
