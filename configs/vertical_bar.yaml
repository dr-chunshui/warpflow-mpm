# Elastic bar under gravity, fixed at the bottom (ULMPM equivalent of a
# Karamelo Vertical_bar case).  Units: Pa, m, s.

dimension: 2
box: [[-0.2, -0.05], [0.2, 1.05]]
cellsize: 0.05
basis: linear
precision: float64

method:
  type: ulmpm
  transfer: flip
  pic_flip: 0.99
  scheme: musl

materials:
  - id: mat1
    model: linear-elastic
    rho: 1000.0
    E: 1.0e6
    nu: 0.3

regions:
  - id: rBar
    type: box
    center: [0.0, 0.5]
    size: [0.1, 0.5]
  - id: rBottom
    type: box
    center: [0.0, 0.0]
    size: [0.3, 0.05]

solids:
  - id: sBar
    material: mat1
    region: rBar
    ppc: 2

boundary_conditions:
  - id: fixedBottom
    type: velocity_nodes
    region: rBottom
    vx: 0
    vy: 0
  - id: gravity
    type: body_force
    g: [0, -9.8]

output:
  interval: 50
  particle_dump: dump_p.*.LAMMPS
  fields: [x, y, vx, vy, s11, s22, s12]
  log: [kinetic_energy, strain_energy]

run:
  end_time: 1.0
  dt_factor: 0.9
